name: Android APK (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Zip'i ac
        run: |
          ZIP=$(ls *.zip | head -1)
          mkdir proje
          unzip -q "$ZIP" -d proje
          if [ ! -f proje/settings.gradle.kts ]; then
            mv proje/*/* proje/ || true
            mv proje/*/.[!.]* proje/ 2>/dev/null || true
          fi
          ls -la proje

      - name: Derle
        working-directory: proje
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zekametre-debug-apk
          path: proje/app/build/outputs/apk/debug/app-debug.apk
