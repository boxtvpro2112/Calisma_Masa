name: Android APK (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Zip'i ac
        run: |
          ZIP=$(ls *.zip | head -1)
          mkdir proje
          unzip -q "$ZIP" -d proje
          if [ ! -f proje/gradlew ]; then
            mv proje/*/* proje/ || true
            mv proje/*/.[!.]* proje/ 2>/dev/null || true
          fi

      - name: Derle
        working-directory: proje
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zekametre-debug-apk
          path: proje/app/build/outputs/apk/debug/app-debug.apk
